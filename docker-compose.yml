version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hdtech_cms_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-cms_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hdtech_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hdtech_cms_backend
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-admin}@postgres:5432/${DB_NAME:-cms_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_construction_jwt_key_2026}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - hdtech_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hdtech_cms_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - hdtech_network

volumes:
  postgres_data:
    driver: local

networks:
  hdtech_network:
    driver: bridge
